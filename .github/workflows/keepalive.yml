name: Supabase Keep Alive

on:
  schedule:
    # Runs every 3 days at 00:00 UTC
    - cron: '0 0 */3 * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  ping-and-keep-active:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          # Clean trailing slashes if present in SUPABASE_URL
          RAW_URL="${{ secrets.SUPABASE_URL }}"
          CLEAN_URL="${RAW_URL%/}"

          # Send request with both apikey and Bearer token headers for JWT anon key
          STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" "${CLEAN_URL}/rest/v1/" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")

          echo "Status: $STATUS_CODE"

          # Verify response
          if [ "$STATUS_CODE" -eq 200 ]; then
            echo "SUCCESS: Supabase project pinged successfully!"
          else
            echo "ERROR: Supabase ping failed with status code $STATUS_CODE"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Auto-commit to keep workflow active
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          date > keepalive.txt
          git add keepalive.txt
          git commit -m "Chore: Keep-alive heartbeat [skip ci]" || exit 0
          git push
