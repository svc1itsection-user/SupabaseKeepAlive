name: Supabase Keep Alive

on:
  schedule:
    # Runs every 3 days at 00:00 UTC to keep Supabase active
    - cron: '0 0 */3 * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: write # Enables automatic commit permission

jobs:
  ping-and-keep-active:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          curl -s -i -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Keep GitHub repo active (Prevents 60-day pause)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          date > keepalive.txt
          git add keepalive.txt
          git commit -m "Chore: Keep-alive heartbeat [skip ci]" || exit 0
          git push
